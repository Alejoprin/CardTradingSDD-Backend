spring:
  config:
    activate:
      on-profile: dev

  application:
    name: card-trading-backend

  datasource:
    url: jdbc:postgresql://ep-shiny-moon-abm8gkhe-pooler.eu-west-2.aws.neon.tech/cardtrading-db?sslmode=require
    username: neondb_owner
    password: npg_uGLbABK5mz9t
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: card-trading-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.cardtrading.event.model

  data:
    redis:
      host: localhost
      port: 6379
    repositories:
      enabled: false

  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

app:
  firebase:
    bucket: ${FIREBASE_BUCKET}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:./firebase-service-account.json}

  jwt:
    secret: ${JWT_SECRET:dev-secret-key}
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000

  mail:
    from: ${MAIL_FROM:franbule950128@gmail.com}
    from-name: Card Trading Platform

  cors:
    allowed-origins: "http://localhost:3000"

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness,liveness

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cardtrading: DEBUG
    org.springframework.security: DEBUG