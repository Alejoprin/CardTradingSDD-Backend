spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cardtrading
    username: cardtrading
    password: cardtrading

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey  # ← Literal "apikey"
    password: ${SENDGRID_API_KEY}  # ← PEGA TU API KEY
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

logging:
  level:
    com.cardtrading: DEBUG
    org.springframework.security: DEBUG

management:
  endpoint:
    health:
      show-details: always
app:
  mail:
    from: franbule950128@gmail.com  # ← Email verificado
    from-name: Card Trading Platform